<!-- ABC:widget hero — section-scoped variation switcher (dev-only; removed at finalize) -->
<script>
(() => {
  /* ABC:config */
  const ID      = 'hero';   // experiment id — MUST equal the section's data-abc-scope="…"
  const LETTERS = 'ABCD';   // one letter per live variation, in cycle order
  const RELOAD  = false;    // true → each switch reloads the page (for draw-in / scroll scenes)
  /* /ABC:config */

  // --- shared manager: defined ONCE, even if several widget blocks are pasted on a page ---
  const M = window.__abc || (window.__abc = (() => {
    const insts = [];
    const st = document.createElement('style');
    st.textContent =
      '.abc-switch{position:fixed;left:14px;bottom:14px;z-index:2147483000;width:36px;height:36px;' +
      'border-radius:50%;border:1.6px solid var(--ink,#14171c);background:var(--paper,#fff);' +
      'color:var(--ink,#14171c);font:700 16px/33px "Rubik",-apple-system,sans-serif;' +
      'text-align:center;cursor:pointer;opacity:.55;user-select:none;' +
      '-webkit-tap-highlight-color:transparent;transition:opacity .16s ease}' +
      '.abc-switch:hover{opacity:1}.abc-switch[hidden]{display:none}';
    document.head.appendChild(st);
    let raf = 0;
    function recompute() {
      raf = 0;
      const vh = innerHeight;
      for (const i of insts) {
        const r = i.scope.getBoundingClientRect();
        const shown = Math.min(r.bottom, vh) - Math.max(r.top, 0);
        // "the section I'm looking at": crosses the viewport's central band, OR a tall
        // section fills half the view, OR a short section sits fully on screen.
        i.visible = r.bottom > 0 && r.top < vh &&
          ((r.top < vh * 0.6 && r.bottom > vh * 0.4) || shown >= vh * 0.5 ||
           (r.height > 0 && shown >= r.height * 0.6));
        i.btn.hidden = !i.visible;
      }
      // stack whatever buttons are visible so they never overlap (topmost section lowest)
      insts.filter(i => i.visible).sort((a, b) => a.top() - b.top())
        .forEach((i, n) => { i.btn.style.bottom = (14 + n * 46) + 'px'; });
    }
    const schedule = () => { if (!raf) raf = requestAnimationFrame(recompute); };
    addEventListener('scroll', schedule, { passive: true });
    addEventListener('resize', schedule);
    return {
      add(inst) { insts.push(inst); schedule(); },
      get(id) { return insts.find(i => i.id === id) || null; },
      list() { return insts.map(i => i.id); },
      relayout: schedule,
    };
  })());

  // --- this experiment ---
  const scope = document.querySelector('[data-abc-scope="' + ID + '"]');
  if (!scope) { console.warn('[abc] no element with data-abc-scope="' + ID + '"'); return; }
  const KEY = 'abc:' + location.pathname + ':' + ID;

  let cur = (new URLSearchParams(location.search).get('abc-' + ID) || '').toUpperCase()
         || localStorage.getItem(KEY) || LETTERS[0];
  if (!LETTERS.includes(cur)) cur = LETTERS[0];

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'abc-switch';
  btn.dataset.abcFor = ID;   // which experiment this button drives (runtime-only; aids QA)
  btn.hidden = true;
  btn.title = ID + ' variation — click: next, ⌥click: previous';
  document.body.appendChild(btn);

  function apply(letter) {
    cur = letter;
    localStorage.setItem(KEY, cur);
    scope.setAttribute('data-abc', cur);
    btn.textContent = cur;
    scope.querySelectorAll('[data-abc-only]').forEach(el => {
      el.style.display = el.getAttribute('data-abc-only').split(/\s+/).includes(cur) ? '' : 'none';
    });
    scope.dispatchEvent(new CustomEvent('abc:change', { detail: { id: ID, variant: cur }, bubbles: true }));
  }

  btn.addEventListener('click', e => {
    const step = e.altKey ? LETTERS.length - 1 : 1;
    const next = LETTERS[(LETTERS.indexOf(cur) + step) % LETTERS.length];
    if (RELOAD) {
      localStorage.setItem(KEY, next);
      sessionStorage.setItem('abc:scroll', String(scrollY));
      const u = new URL(location.href);
      u.searchParams.set('abc-' + ID, next);
      location.href = u.href;
    } else apply(next);
  });

  M.add({
    id: ID, scope, btn, visible: false,
    top: () => scope.getBoundingClientRect().top,
    letters: LETTERS, get current() { return cur; }, set: apply,
  });

  const y = sessionStorage.getItem('abc:scroll');
  if (y !== null) { sessionStorage.removeItem('abc:scroll'); addEventListener('load', () => scrollTo(0, +y)); }

  apply(cur);
})();
</script>
<!-- /ABC:widget hero -->
